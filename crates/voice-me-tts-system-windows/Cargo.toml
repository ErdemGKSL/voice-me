[package]
name = "voice-me-tts-system-windows"
version = "0.1.0"
edition.workspace = true

# Story 3.13: the System voice on Windows. WinRT's
# `Windows.Media.SpeechSynthesis.SpeechSynthesizer` renders into a stream —
# never to the speaker — and its WAV is decoded here. Offline: no HTTP
# client (AD-8), and no dependency on `voice-me-ui` (AD-1/AD-2).
[dependencies]
voice-me-core = { path = "../voice-me-core" }
# The engine's WAV is usually 22 050 Hz; AD-11's buffer is 24 kHz. The
# version the other adapters already use. Unconditional, so the pure WAV
# module is tested on every OS.
rubato = "5.0.0"

[target.'cfg(target_os = "windows")'.dependencies]
# The `windows` 0.62 the workspace already locks (gpui, the app).
windows = { version = "0.62", features = [
  "Foundation",
  "Foundation_Collections",
  # `SynthesizeTextToStreamAsync` is gated on `Media_Core` as well.
  "Media_Core",
  "Media_SpeechSynthesis",
  "Storage_Streams",
  # `CoIncrementMTAUsage`: one process-lifetime multithreaded apartment.
  "Win32_System_Com",
] }
