[package]
name = "voice-me-hotkey-linux"
version = "0.1.0"
edition.workspace = true

[dependencies]
voice-me-core = { path = "../voice-me-core" }
# X11 backend: a real `XGrabKey` exclusive grab, which is also what makes
# inline conflict detection possible (spec-2-3 Design Notes). Its accelerator
# syntax (`Ctrl+Alt+KeyV`) is the persisted hotkey format for *both* backends,
# so this crate is also the parser for the evdev path.
global-hotkey = "0.8"
# Wayland fallback: `global-hotkey` is X11-only and GNOME does not implement
# the GlobalShortcuts portal, so a passive read of `/dev/input/event*` is the
# only way a global hotkey works in a GNOME/Wayland session (spec-2-3
# decision 1). No default features: this path only needs the blocking
# `Device`/`fetch_events` API, so the optional `tokio`/`stream-trait` async
# stack stays out of the build.
evdev = { version = "0.13", default-features = false }
# The crate body is `#![cfg(target_os = "linux")]`, but its dependencies
# are still built on Windows (`cargo test --workspace`). These three only
# serve the Linux-only code, and `ashpd` does not compile off Unix.
[target.'cfg(target_os = "linux")'.dependencies]
# GNOME/KDE native path (spec-native-gnome-kde-hotkey): the D-Bus summon
# service the GNOME shortcut's `gdbus call` reaches, and the kglobalaccel
# client. The locked 5.x with exactly the features gpui-tray already
# enables (async-io + blocking API), so no second zbus build is added.
zbus = { version = "5.19", default-features = false, features = ["async-io", "blocking-api"] }
# The xdg-desktop-portal GlobalShortcuts path for other Wayland compositors.
# The 0.13 gpui already locks, on async-io like gpui's own use of it.
ashpd = { version = "0.13", default-features = false, features = ["async-io", "global_shortcuts"] }
# `block_on` for ashpd's futures on this crate's own threads, and the
# spike example's `AppEventSender` channel — already resolved to 0.3.34 in
# Cargo.lock via gpui's own dependency graph.
futures = "0.3"
