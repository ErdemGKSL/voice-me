[package]
name = "voice-me-tts-edge"
version = "0.1.0"
edition.workspace = true

# Story 3.17: Edge TTS on Linux. Microsoft's Edge Read Aloud voices through
# the user-installed `edge-tts` program (LGPL-3.0), which runs as a bounded
# child process through the one shared runner (AD-12) and is never linked
# or shipped. This crate opens no socket and has no HTTP client (AD-8): the
# child process does the talking.
[dependencies]
voice-me-core = { path = "../voice-me-core" }
# The one bounded runner (`process::run`) and the os-release distro
# detection.
voice-me-tts-system-linux = { path = "../voice-me-tts-system-linux" }
# `edge-tts` writes 24 kHz mono MP3. The version `voice-me-tts` already uses.
symphonia = { version = "0.6.1", features = ["mp3"] }
# Only for an MP3 that is not 24 kHz, which should not happen. The version
# `voice-me-tts-system-linux` already uses.
rubato = "5.0.0"

[dev-dependencies]
tempfile = "3.14"
