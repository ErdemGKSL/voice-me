[package]
name = "voice-me-deps"
version = "0.1.0"
edition.workspace = true

[dependencies]
voice-me-core = { path = "../voice-me-core" }
# Story 3.2: the only HTTP client in the workspace besides the future remote
# TTS crate (AD-8). Plain HTTPS GETs against pinned, immutable URLs — no
# Hugging Face Hub client. rustls with the bundled webpki roots, so a
# download never depends on the machine's OpenSSL or certificate store.
# Bodies are read with `Response::chunk`, which needs no `stream` feature.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
# Only to find the AD-5 runtime the blocking job runs on (or build a small
# one when there is none, as in tests). The I/O and timer drivers reqwest
# needs are enabled by reqwest's own tokio features.
tokio = { version = "1.53", default-features = false, features = ["rt"] }
# Every downloaded file is checked against a SHA-256 pinned in `sources.rs`
# before it takes its final name.
sha2 = "0.10"
# Story 3.15: a user-chosen Piper voice is checked with the digest its
# catalog publishes — MD5 for `rhasspy/piper-voices`, the Git blob SHA-1
# Hugging Face reports for a non-LFS `config.json`. Same `digest` 0.10 trait
# as `sha2`.
md-5 = "0.10"
sha1 = "0.10"
# Story 3.15: the three Piper catalogs are JSON.
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# The Linux ONNX Runtime ships as a `.tgz`; only its real shared library is
# extracted. (Windows ships a `.zip`, below.)
flate2 = "1.1"
tar = { version = "0.4", default-features = false }
# The Windows ONNX Runtime ships as a `.zip`; the same single-entry
# extraction. Unconditional, so the zip path is tested on every OS; only
# deflate, the method Microsoft's archive uses.
zip = { version = "8.6", default-features = false, features = ["deflate"] }
# Story 3.3: the CUDA capability probe opens the NVIDIA driver library
# (`libcuda.so.1` / `nvcuda.dll`) at run time — a missing driver is a
# "not found" answer, never a link error. The version `ash` already uses.
libloading = "0.8"
# Story 3.3: the WebGPU capability probe enumerates Vulkan adapters through
# a runtime-loaded loader (`loaded`), so a machine with no Vulkan at all
# still starts. Already in Cargo.lock through gpui's own graph.
ash = { version = "0.38", default-features = false, features = ["loaded", "std"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Decision 1: the Virtual Microphone's status is *asked of* the crate that
# already owns every line of PipeWire knowledge, never detected a second
# time here. Story 3.2's Install reuses its idempotent `install()`.
voice-me-audio-linux = { path = "../voice-me-audio-linux" }
# Story 3.12: whether `espeak-ng` is on PATH, and the distribution's install
# command, are *asked of* the crate that runs it — the same rule as above.
# Story 3.15: that crate is now `voice-me-espeak`, shared by the System
# voice and Piper.
voice-me-espeak = { path = "../voice-me-espeak" }
# Story 3.17: where `edge-tts` is, and the pipx steps, asked of the crate
# that runs it.
voice-me-tts-edge = { path = "../voice-me-tts-edge" }

[target.'cfg(target_os = "windows")'.dependencies]
# Story 3.16: where `espeak-ng.exe` is, asked of the crate that runs it, and
# the one bounded runner Install's `msiexec /a` goes through (AD-12).
voice-me-espeak = { path = "../voice-me-espeak" }
# Story 2.8: whether VB-CABLE's "CABLE Input" is present, and the elevated
# launch of VB's own setup, are *asked of* the crate that plays to it —
# the same rule as the Linux audio crate above.
voice-me-audio-windows = { path = "../voice-me-audio-windows" }

[dev-dependencies]
tempfile = "3.14"
# The `AppEvent` channel the check reports on (AD-3).
futures = "0.3"
# A real multi-threaded AD-5 runtime, for the test that drives `provision`
# the way the app does.
tokio = { version = "1.53", default-features = false, features = ["rt", "rt-multi-thread"] }
