[package]
name = "voice-me-core"
version = "0.1.0"
edition.workspace = true

[dependencies]
thiserror = "2.0.20"
directories = "6.0"
serde = { version = "1.0", features = ["derive"] }
toml = "1.1"
# Only for the `gpui_kit::App` context type `TrayPort::show` threads through to
# adapters (see ports.rs) — never the tray crate itself (spec-2-1).
gpui-kit = { version = "0.6.4", default-features = false }

[dev-dependencies]
tempfile = "3.14"
