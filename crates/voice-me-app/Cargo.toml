[package]
name = "voice-me-app"
version = "0.1.0"
edition.workspace = true

[[bin]]
name = "voice-me"
path = "src/main.rs"

[dependencies]
gpui-kit = "0.6.4"
voice-me-core = { path = "../voice-me-core" }
voice-me-ui = { path = "../voice-me-ui" }
# Story 2.6: the Speak Action now actually generates. The composition root
# is the only place allowed to know both the port and its adapter.
voice-me-tts = { path = "../voice-me-tts" }
# Stories 3.1/3.2/3.4: the Dependency Check and one-click provisioning.
# One of the two network-capable crates this binary links (AD-8).
voice-me-deps = { path = "../voice-me-deps" }
# Story 3.6: generation through a remote provider with the user's own key.
# The other network-capable crate (AD-8) — `voice-me-tests` fails on a
# third.
voice-me-tts-remote = { path = "../voice-me-tts-remote" }
# Story 3.15: Piper voices, in-process on the shared CPU runtime. Offline.
voice-me-tts-piper = { path = "../voice-me-tts-piper" }
# For the `AppEvent` channel (AD-3) — already resolved to 0.3.34 in
# Cargo.lock via gpui's own dependency graph.
futures = "0.3"

[target.'cfg(target_os = "linux")'.dependencies]
voice-me-tray-linux = { path = "../voice-me-tray-linux" }
voice-me-hotkey-linux = { path = "../voice-me-hotkey-linux" }
voice-me-notify-linux = { path = "../voice-me-notify-linux" }
# Story 2.9: the generated buffer is played through the Virtual Microphone.
voice-me-audio-linux = { path = "../voice-me-audio-linux" }
# Story 3.12: the System voice — eSpeak NG as a bounded child process.
# Offline; Linux only (Windows is Story 3.13).
voice-me-tts-system-linux = { path = "../voice-me-tts-system-linux" }
# Story 3.17: Edge TTS — the user-installed `edge-tts` program as a bounded
# child process. Linux only; no reqwest.
voice-me-tts-edge = { path = "../voice-me-tts-edge" }
# Story 3.15: Piper phonemizes through `espeak-ng`, run by this crate only.
voice-me-espeak = { path = "../voice-me-espeak" }

[target.'cfg(target_os = "windows")'.dependencies]
voice-me-tray-windows = { path = "../voice-me-tray-windows" }
voice-me-hotkey-windows = { path = "../voice-me-hotkey-windows" }
voice-me-notify-windows = { path = "../voice-me-notify-windows" }
voice-me-audio-windows = { path = "../voice-me-audio-windows" }
# Story 3.13: the System voice — Windows' own speech engine through WinRT,
# rendered into a stream, never to the speaker. Offline.
voice-me-tts-system-windows = { path = "../voice-me-tts-system-windows" }
# The overlay's borderless look: DWM's own 1px border, shadow and corner
# rounding are switched off on its window. The `windows` 0.62 gpui already
# locks, and the window's HWND comes from gpui through raw-window-handle.
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Dwm"] }
raw-window-handle = "0.6"
