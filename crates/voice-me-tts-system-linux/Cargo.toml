[package]
name = "voice-me-tts-system-linux"
version = "0.1.0"
edition.workspace = true

# Story 3.12: the System voice on Linux. eSpeak NG is GPL-3.0, so it is
# never linked: `espeak-ng` runs as a bounded child process (AD-12's one
# exception) through `voice-me-espeak`, and its WAV is parsed here. Offline — no HTTP client (AD-8).
[dependencies]
voice-me-core = { path = "../voice-me-core" }
# Story 3.15: the bounded `espeak-ng` runner lives there now, shared with
# Piper. Behaviour here is unchanged.
voice-me-espeak = { path = "../voice-me-espeak" }
# eSpeak NG writes 22 050 Hz; AD-11's buffer is 24 kHz. The version
# `voice-me-tts-remote` already uses.
rubato = "5.0.0"

[dev-dependencies]
tempfile = "3.14"
