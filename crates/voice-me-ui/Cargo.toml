[package]
name = "voice-me-ui"
version = "0.1.0"
edition.workspace = true

[dependencies]
voice-me-core = { path = "../voice-me-core" }
gpui-kit = "0.6.4"
cpal = "0.18"
hound = "3.5"
rodio = { version = "0.22", default-features = false, features = ["playback", "wav", "mp3"] }

[dev-dependencies]
gpui-kit = { version = "0.6.4", features = ["test-support"] }
# The `AppEvent` channel the Prompt Overlay tests drain (AD-3).
futures = "0.3"
tempfile = "3.14"
