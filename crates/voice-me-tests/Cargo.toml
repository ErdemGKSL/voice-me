[package]
name = "voice-me-tests"
version = "0.1.0"
edition.workspace = true

[dependencies]
voice-me-core = { path = "../voice-me-core" }
voice-me-ui = { path = "../voice-me-ui" }

[dev-dependencies]
tempfile = "3.14"
# Stories 3.1/3.4: the blocked-overlay decision is exercised against the
# real `PromptOverlayView` and a real `AppEvent` channel.
gpui-kit = { version = "0.6.4", features = ["test-support"] }
futures = "0.3"
# Story 3.6: the egress allowlist reads every crate's manifest.
toml = "1.1"
