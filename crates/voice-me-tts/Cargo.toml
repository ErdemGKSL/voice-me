[package]
name = "voice-me-tts"
version = "0.1.0"
edition.workspace = true

[dependencies]
voice-me-core = { path = "../voice-me-core" }
# AD-12: Chatterbox-Multilingual runs in-process on ONNX Runtime — there is
# no sidecar and no Python. `default-features = false` is load-bearing: ort's
# defaults fetch a prebuilt runtime at build time (and drag an HTTP client
# into the workspace) — exactly what AD-8 forbids. `load-dynamic` instead
# resolves the library at run time: the one `voice-me-deps` installs into
# the cache, `ORT_DYLIB_PATH`, or one the user added. The binary CI builds
# carries no runtime and downloads nothing.
#
# `cuda` and `webgpu` (Story 3.3) only compile in the two execution
# providers' *registration* code — under `load-dynamic` they link nothing and
# download nothing. Whether a provider is actually there is a property of
# the runtime library loaded at run time: voice-me's own build (Story 3.8)
# has CPU, WebGPU and CUDA in one library, so switching between them is a
# session rebuild.
ort = { version = "2.0.0-rc.13", default-features = false, features = [
  "std",
  "ndarray",
  "half",
  "api-27",
  "cuda",
  "webgpu",
  "load-dynamic",
] }
# Story 3.8: NVIDIA's libraries are loaded from the cache (`dlopen` with
# `RTLD_GLOBAL` on Linux, `LoadLibraryExW` on Windows) before the CUDA
# provider is registered. The same version `voice-me-deps` already uses.
libloading = "0.8"
# The version ort rc.13 itself depends on — a mismatch here means its
# `try_extract_array` returns a type this crate cannot name.
ndarray = "0.17"
# The exported `tokenizer.json` is a BPE tokenizer whose `TemplateProcessing`
# wraps every sequence as `[6563, 255, …, 0, 6561, 6561]`. Loading it with
# this crate reproduces the template for free; hand-rolling it would mean
# reimplementing the template exactly. `onig` only — the default feature set
# pulls in the HF hub HTTP client.
tokenizers = { version = "0.23.2", default-features = false, features = ["onig"] }
# The Reference Voice Sample is whatever the user recorded or picked, so the
# decoder has to cover the common containers. Everything but mp3 is on by
# default.
symphonia = { version = "0.6.1", features = ["mp3"] }
# The fp16 `language_model` variant's 60 KV tensors are f16, so the loop has
# to be able to name that type. Pure Rust, no download.
half = "2.4"
# `speech_encoder` holds a fixed internal 24k→16k resample, so its input must
# *literally* be 24 kHz — a clip at any other rate has to be converted, not
# merely relabelled.
rubato = "5.0.0"

[dev-dependencies]
# The spike example is hosted inside a real GPUI app (AD-5 is only proven
# from inside `application().run(..)`).
gpui-kit = { version = "0.6.4", default-features = false }
futures = "0.3"
tokio = { version = "1.53", default-features = false, features = ["rt", "rt-multi-thread"] }
# Writing the generated buffer out as a wav, so it can be listened to.
hound = "3.5"
tempfile = "3.14"
