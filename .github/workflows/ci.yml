name: CI

# Only pushes to main build; other branches and pull requests do not.
on:
  push:
    branches: [main]

jobs:
  build-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install native build dependencies (cpal/gpui-kit/rodio/libpulse)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libasound2-dev \
            libpulse-dev \
            libfontconfig1-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libx11-dev \
            libxcb1-dev \
            libxcursor-dev \
            libxi-dev \
            libxrandr-dev \
            libssl-dev \
            espeak-ng
      # Story 3.17: a pinned `edge-tts`, so `find_program` and the
      # Dependencies row see a real program. Every test that reaches
      # Microsoft's service stays off (VOICE_ME_EDGE_TTS_ONLINE unset).
      - name: Install edge-tts
        run: pipx install edge-tts==7.2.8
      - run: cargo build --workspace
      # The tests are written to pass with no audio server; the ones that
      # need one are `#[ignore]`d. Without this step nothing automated ever
      # executes them.
      - run: cargo test --workspace

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --workspace
      # `cargo build` never compiles `#[cfg(test)]` code, so without this
      # every `cfg(not(target_os = "linux"))` test — the ones that exist
      # precisely because they cannot run on the Ubuntu job — would be dead
      # code nothing ever executed.
      - run: cargo test --workspace
