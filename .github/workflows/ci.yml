name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install native build dependencies (cpal/gpui-kit/rodio/libpulse)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libasound2-dev \
            libpulse-dev \
            libfontconfig1-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libx11-dev \
            libxcb1-dev \
            libxcursor-dev \
            libxi-dev \
            libxrandr-dev \
            libssl-dev \
            espeak-ng
      - run: cargo build --workspace
      # The tests are written to pass with no audio server; the ones that
      # need one are `#[ignore]`d. Without this step nothing automated ever
      # executes them.
      - run: cargo test --workspace

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --workspace
      # `cargo build` never compiles `#[cfg(test)]` code, so without this
      # every `cfg(not(target_os = "linux"))` test — the ones that exist
      # precisely because they cannot run on the Ubuntu job — would be dead
      # code nothing ever executed.
      - run: cargo test --workspace
