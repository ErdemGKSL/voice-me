[workspace]
resolver = "2"
members = [
  "crates/voice-me-app",
  "crates/voice-me-core",
  "crates/voice-me-ui",
  "crates/voice-me-i18n",
  "crates/voice-me-hotkey-linux",
  "crates/voice-me-hotkey-windows",
  "crates/voice-me-audio-linux",
  "crates/voice-me-audio-windows",
  "crates/voice-me-tray-linux",
  "crates/voice-me-tray-windows",
  "crates/voice-me-notify-linux",
  "crates/voice-me-notify-windows",
  "crates/voice-me-tts",
  "crates/voice-me-tts-remote",
  "crates/voice-me-tts-system-linux",
  "crates/voice-me-deps",
  "crates/voice-me-tests",
]
default-members = ["crates/voice-me-app"]

[workspace.package]
edition = "2024"

# Smaller release binary with no loss of speed: `opt-level` stays at 3.
# Fat LTO and one codegen unit let LLVM inline across crates and drop dead
# code, which usually makes the binary faster as well as smaller. `strip`
# only removes symbols and debug info, which the binary never reads.
# `panic` stays "unwind": background tasks are written to survive a panic
# (see the poisoned-lock recovery in voice-me-core and voice-me-deps).
[profile.release]
lto = "fat"
codegen-units = 1
strip = true
